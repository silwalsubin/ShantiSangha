name: IBKR Gateway Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/ibkr-gateway/**'
      - '.github/workflows/ibkr-gateway-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push IBKR gateway image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shantisangha-ibkr-gateway
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f infrastructure/ibkr-gateway/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            infrastructure/ibkr-gateway
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Gateway has its own ECS service now. The task definition
      # references :latest, so force-deploying the gateway service is
      # what pulls the freshly-pushed image. The API service is
      # untouched — its rolling deploys handle backend code changes
      # independently.
      - name: Force ECS gateway service redeployment
        run: |
          aws ecs update-service \
            --cluster shantisangha-cluster \
            --service shantisangha-ibkr-gateway \
            --force-new-deployment \
            --region us-east-1 >/dev/null
          echo "ECS gateway redeployment triggered."
