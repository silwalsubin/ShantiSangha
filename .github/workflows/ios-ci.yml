name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'ios/**'

jobs:
  test:
    name: Unit Tests
    runs-on: macos-14

    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild test \
            -project ShantiSangha.xcodeproj \
            -scheme ShantiSangha \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:ShantiSanghaTests \
            -resultBundlePath TestResults.xcresult \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty --color || true

          # Check if tests actually passed
          xcodebuild test \
            -project ShantiSangha.xcodeproj \
            -scheme ShantiSangha \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:ShantiSanghaTests \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tail -5 | grep -q "TEST SUCCEEDED"
