name: Python (wisecat) Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'python/**'
      - '.github/workflows/python-deploy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/wisecat/requirements.txt

      - name: Install dependencies
        working-directory: python
        run: |
          pip install -r wisecat/requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: python
        run: pytest wisecat/tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        id: build-image
        working-directory: python
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shantisangha-wisecat
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg GIT_HASH=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            -f wisecat/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Lambda function code
        env:
          FUNCTION_NAME: shantisangha-wisecat
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          if ! aws lambda get-function --function-name "$FUNCTION_NAME" --region us-east-1 >/dev/null 2>&1; then
            echo "Lambda function $FUNCTION_NAME does not exist yet."
            echo "Image has been pushed to ECR; run terraform apply to create the function."
            exit 0
          fi

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" \
            --region us-east-1 >/dev/null

          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region us-east-1
          echo "Lambda function $FUNCTION_NAME updated to $IMAGE_URI"
