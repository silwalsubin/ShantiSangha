name: WiseCat Monthly Retrain

# Retrains every per-horizon LightGBM Buy/Hold/Sell classifier on a fresh
# yfinance pull of the basket, then commits the new gbm_<horizon>.joblib
# artifacts back to main. The push automatically triggers python-deploy.yml
# which rebuilds the Lambda container image and rolls it out.
#
# Cadence rationale: the 1M horizon predicts a 21-trading-day forward
# window, so once a month an entire eval cycle has passed and older
# training data is meaningfully stale. Quarterly is fine; monthly is the
# upper bound where retraining still earns its cost.
#
# Manual override: use `workflow_dispatch` from the Actions tab when you
# want to retrain off-schedule (regime change, post-feature-redesign,
# adding tickers, etc.). The default inputs match the cron run.

on:
  schedule:
    # 04:00 UTC on the 1st of every month — quietest time across US/EU/Asia.
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      horizons:
        description: 'Space-separated horizons to retrain (1W 1M 1Y).'
        required: false
        default: '1W 1M 1Y'
      limit:
        description: 'Train on the first N tickers from the basket.'
        required: false
        default: '30'

# Only one retrain at a time — prevents an ad-hoc dispatch from racing
# the scheduled cron, which would produce two competing model artifacts
# pushed to main.
concurrency:
  group: wisecat-retrain
  cancel-in-progress: false

permissions:
  contents: write   # push the new model artifact
  actions: write    # `gh workflow run` to trigger python-deploy

jobs:
  retrain:
    name: Train + commit artifacts
    runs-on: ubuntu-latest
    # 30 tickers × 3 horizons takes ~4 hours wall time. Cap at 5h to
    # surface real hangs before GitHub's 6h hard cap kills the job
    # mid-commit and leaves the artifacts in a half-trained state.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Install OS dependencies (libgomp for LightGBM)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/wisecat/requirements.txt

      - name: Install Python dependencies
        working-directory: python
        run: |
          pip install -r wisecat/requirements.txt
          pip install pytest

      - name: Run wisecat tests
        working-directory: python
        run: pytest wisecat/tests -q

      - name: Train (yfinance allowed for fresh history)
        working-directory: python
        run: |
          HORIZONS="${{ github.event.inputs.horizons || '1W 1M 1Y' }}"
          LIMIT="${{ github.event.inputs.limit || '30' }}"
          echo "Retraining horizons=[$HORIZONS] limit=$LIMIT"
          python -m wisecat.train \
            --horizons $HORIZONS \
            --basket wisecat/data/nasdaq100.txt \
            --limit "$LIMIT" \
            --allow-network

      - name: Commit artifacts if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only the things training writes — never the per-ticker
          # cache_*.parquet (gitignored) and never random workspace files.
          git add python/wisecat/models/gbm_*.joblib
          git add python/wisecat/data/context/*.parquet

          if git diff --cached --quiet; then
            echo "No artifact diff — nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          git commit -m "WiseCat: monthly retrain ${DATE}

          Triggered by ${{ github.event_name }}. Auto-pushed by GitHub Actions
          retrain workflow; python-deploy is dispatched explicitly in the
          next step (push events fired by GITHUB_TOKEN do not cascade)."

          # Training takes ~4h; main may have advanced. Rebase the artifact
          # commit onto fresh main and retry the push a few times to absorb
          # races. Artifacts live in their own paths (models/gbm_*.joblib,
          # data/context/*.parquet) so rebase has no conflict surface.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $attempt rejected — refetching and retrying"
            sleep 5
          done
          echo "Push failed after 5 attempts" >&2
          exit 1

      - name: Trigger python-deploy
        # Pushes made by GITHUB_TOKEN do not trigger downstream workflows
        # (GitHub's recursion guard). workflow_dispatch IS one of the
        # exceptions, so we fire python-deploy explicitly here. Skipped
        # when there's no artifact change to ship.
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run python-deploy.yml --ref main

      - name: Summary
        if: always()
        run: |
          echo "## Retrain summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Horizons: ${{ github.event.inputs.horizons || '1W 1M 1Y' }}" >> $GITHUB_STEP_SUMMARY
          echo "Limit: ${{ github.event.inputs.limit || '30' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Look for \`Mean OOS accuracy\` in the train step's logs to gauge model quality." >> $GITHUB_STEP_SUMMARY
