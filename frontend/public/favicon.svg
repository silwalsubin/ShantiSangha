<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>
  <g transform="translate(16,16)" stroke="#fff" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Central orb -->
    <circle cx="0" cy="0" r="2" fill="#fff" fill-opacity="0.3" stroke="#fff" stroke-width="0.9"/>
    <circle cx="0" cy="0" r="0.8" fill="#fff" stroke="none"/>
    <!-- Lotus petals around orb -->
    <path d="M0-2 C-1.2-2.8-1.2-3.8 0-3.8 C1.2-3.8 1.2-2.8 0-2" fill="#fff" fill-opacity="0.15"/>
    <path d="M0 2 C-1.2 2.8-1.2 3.8 0 3.8 C1.2 3.8 1.2 2.8 0 2" fill="#fff" fill-opacity="0.15"/>
    <path d="M-2 0 C-2.8-1.2-3.8-1.2-3.8 0 C-3.8 1.2-2.8 1.2-2 0" fill="#fff" fill-opacity="0.15"/>
    <path d="M2 0 C2.8-1.2 3.8-1.2 3.8 0 C3.8 1.2 2.8 1.2 2 0" fill="#fff" fill-opacity="0.15"/>
    <!-- Up prong: open leaf shape -->
    <path d="M-1-3.8 C-1.5-5-3-6.5-3.5-7.5 C-3-8.5-1.5-8.5 0-10" stroke-width="0.9"/>
    <path d="M1-3.8 C1.5-5 3-6.5 3.5-7.5 C3-8.5 1.5-8.5 0-10" stroke-width="0.9"/>
    <path d="M0-3.8 L0-10" stroke-width="0.6"/>
    <!-- Up pointed tip -->
    <path d="M0-10 L-0.6-11.5" stroke-width="0.8"/><path d="M0-10 L0.6-11.5" stroke-width="0.8"/>
    <path d="M-0.6-11.5 L0-12.5 L0.6-11.5" stroke-width="0.8"/>
    <!-- Down prong -->
    <path d="M-1 3.8 C-1.5 5-3 6.5-3.5 7.5 C-3 8.5-1.5 8.5 0 10" stroke-width="0.9"/>
    <path d="M1 3.8 C1.5 5 3 6.5 3.5 7.5 C3 8.5 1.5 8.5 0 10" stroke-width="0.9"/>
    <path d="M0 3.8 L0 10" stroke-width="0.6"/>
    <!-- Down pointed tip -->
    <path d="M0 10 L-0.6 11.5" stroke-width="0.8"/><path d="M0 10 L0.6 11.5" stroke-width="0.8"/>
    <path d="M-0.6 11.5 L0 12.5 L0.6 11.5" stroke-width="0.8"/>
    <!-- Left prong -->
    <path d="M-3.8-1 C-5-1.5-6.5-3-7.5-3.5 C-8.5-3-8.5-1.5-10 0" stroke-width="0.9"/>
    <path d="M-3.8 1 C-5 1.5-6.5 3-7.5 3.5 C-8.5 3-8.5 1.5-10 0" stroke-width="0.9"/>
    <path d="M-3.8 0 L-10 0" stroke-width="0.6"/>
    <!-- Left pointed tip -->
    <path d="M-10 0 L-11.5-0.6" stroke-width="0.8"/><path d="M-10 0 L-11.5 0.6" stroke-width="0.8"/>
    <path d="M-11.5-0.6 L-12.5 0 L-11.5 0.6" stroke-width="0.8"/>
    <!-- Right prong -->
    <path d="M3.8-1 C5-1.5 6.5-3 7.5-3.5 C8.5-3 8.5-1.5 10 0" stroke-width="0.9"/>
    <path d="M3.8 1 C5 1.5 6.5 3 7.5 3.5 C8.5 3 8.5 1.5 10 0" stroke-width="0.9"/>
    <path d="M3.8 0 L10 0" stroke-width="0.6"/>
    <!-- Right pointed tip -->
    <path d="M10 0 L11.5-0.6" stroke-width="0.8"/><path d="M10 0 L11.5 0.6" stroke-width="0.8"/>
    <path d="M11.5-0.6 L12.5 0 L11.5 0.6" stroke-width="0.8"/>
  </g>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32">
      <stop offset="0%" stop-color="#c4873b"/>
      <stop offset="100%" stop-color="#8b5a1b"/>
    </linearGradient>
  </defs>
