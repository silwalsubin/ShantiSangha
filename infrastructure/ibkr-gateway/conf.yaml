    ip2loc: "US"
    proxyRemoteSsl: true
    proxyRemoteHost: "https://api.ibkr.com"
    listenPort: 5000
    listenSsl: true
    ccp: false
    svcEnvironment: "v1"
    sslCert: "vertx.jks"
    sslPwd: "mywebapi"
    authDelay: 3000
    portalBaseURL: ""
    serverOptions:
        blockedThreadCheckInterval: 1000000
        eventLoopPoolSize: 20
        workerPoolSize: 20
        maxWorkerExecuteTime: 100
        internalBlockingPoolSize: 20
    cors:
        origin.allowed: "*"
        allowCredentials: false
    webApps:
        - name: "demo"
          index: "index.html"
    # `ips.allow` uses Java glob patterns. The gateway is deployed as an
    # ECS sidecar in the same task as the .NET API; both ALB health checks
    # and proxied user traffic come from the VPC CIDR 10.0.0.0/16, which
    # IBKR's default conf.yaml rejects. `10.*` covers every VPC subnet;
    # the upstream defaults (192.*, 131.216.*, 127.0.0.1) are preserved
    # so a misrouted local dev request still works.
    #
    # Network-level access is already restricted by the SG: only the ALB
    # SG can reach port 5000 of the ECS task. So this allowlist isn't a
    # real security control — it's just a hurdle to clear so the gateway
    # answers the ALB at all.
    ips:
      allow:
        - 10.*
        - 192.*
        - 131.216.*
        - 127.0.0.1
      deny:
        - 212.90.324.10
