    <path d="M0-90 C-52-152-52-200 0-200 C52-200 52-152 0-90" fill="#fff" fill-opacity="0.2" stroke-width="12"/>
    <path d="M0 90 C-52 152-52 200 0 200 C52 200 52 152 0 90" fill="#fff" fill-opacity="0.2" stroke-width="12"/>
    <path d="M-90 0 C-152-52-200-52-200 0 C-200 52-152 52-90 0" fill="#fff" fill-opacity="0.2" stroke-width="12"/>
    <path d="M90 0 C152-52 200-52 200 0 C200 52 152 52 90 0" fill="#fff" fill-opacity="0.2" stroke-width="12"/>
    <!-- Up prong -->
