    <path d="M52 200 C80 260 160 320 180 360 C160 400 100 400 0 480"/>
    <path d="M0 200 L0 480" stroke-width="12"/>
    <path d="M0 480L-32 540"/><path d="M0 480L32 540"/>
    <path d="M-32 540L0 580L32 540" stroke-width="16"/>
    <!-- Left prong -->
