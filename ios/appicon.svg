    <path d="M-200 52 C-260 80-320 160-360 180 C-400 160-400 100-480 0"/>
    <path d="M-200 0 L-480 0" stroke-width="12"/>
    <path d="M-480 0L-540-32"/><path d="M-480 0L-540 32"/>
    <path d="M-540-32L-580 0L-540 32" stroke-width="16"/>
    <!-- Right prong -->
