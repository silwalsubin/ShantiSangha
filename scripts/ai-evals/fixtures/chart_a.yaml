# Sample chart A — designed to hit multiple test angles in one fixture:
#   - Cancer (Karka) lagna
#   - Saturn in 7th house (in own sign Capricorn → "own_sign" dignity)
#   - Mars in 7th house → Manglik signature triggers
#   - Saturn-Mars conjunction in 7th → conj_mars_saturn signature
#   - Moon in Mrigashirsha nakshatra
#   - Currently in Jupiter Mahadasha / Saturn Antardasha
#
# These five hooks let one chart drive marriage / Manglik / career / self
# questions without needing a separate fixture per test case.

display_name: "Subin"
moon_rashi: "Vrishabha (Taurus)"
sun_rashi: "Karka (Cancer)"
birth_nakshatra: "Mrigashirsha"
panchang_summary: "Today the moon is in Hasta nakshatra under Saubhagya yoga — a steady, capable sky."
mahadasha: "Jupiter"
antardasha: "Saturn"
# Tara bala precomputed by the backend (VedicCalendar.GetTaraBala). Birth
# nakshatra Mrigashirsha is index 4; today's Hasta is index 12. Position
# from janma = ((12 - 4) mod 27) + 1 = 9. Number 9 in the 9-tara cycle =
# Atimitra (favorable). Hard-coded here so the eval mirrors what the C#
# code emits in production.
tara_bala:
  position: 9
  number: 9
  name: "Atimitra"
  polarity: "favorable"
  from_nakshatra: "Mrigashirsha"
  to_nakshatra: "Hasta"
# Tomorrow (one day after the fixture's "today"): moon advances Hasta → Chitra,
# vara is Friday (Shukra). Tara count Mrigashirsha → Chitra = position 10,
# cycle slot 1 = Janma (neutral). Pre-computed here so the eval mirrors what
# the C# JyotishContextService now ships.
tomorrow:
  date: "2026-05-08 is Friday"
  vara: "Friday"
  vara_deity: "Shukra"
  tithi: "Shukla Saptami"
  yoga: "Saubhagya"
  nakshatra: "Chitra"
  nakshatra_quality: "brilliance and independence"
  tara_bala:
    position: 10
    number: 1
    name: "Janma"
    polarity: "neutral"
    from_nakshatra: "Mrigashirsha"
    to_nakshatra: "Chitra"
transit_note: "Saturn is currently transiting their 7th house, echoing its natal placement."

